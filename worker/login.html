<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f9e6e5"><title>Вход · Girl’s Night ♡</title>
<style>
*{box-sizing:border-box}:root{color-scheme:light;--bg:#f9e6e5;--card:#fff8ef;--ink:#492332;--muted:#785260;--gold:#ad7844;--line:#d7a6a6;--accent:#a32b4c;--btn:#fff9ee}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#160e17;--card:#251521;--ink:#fae8df;--muted:#d7b3bc;--gold:#e2bd82;--line:#69414f;--accent:#f5a0b5;--btn:#351320}}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,sans-serif;background:radial-gradient(ellipse at 50% 30%,var(--card),transparent 75%),repeating-conic-gradient(from 45deg,rgba(160,62,94,.09) 0% 25%,transparent 0% 50%) center/48px 48px,var(--bg);color:var(--ink)}
.card{position:relative;width:min(100%,440px);background:var(--card);border:4px double var(--gold);border-radius:28px 28px 12px 12px;padding:39px 32px;box-shadow:0 18px 65px #50192c26}.card:before{content:"♢";position:absolute;top:9px;left:15px;color:var(--gold)}.card:after{content:"♢";position:absolute;top:9px;right:15px;color:var(--gold)}
.heart{font:58px/1 Georgia,serif;color:var(--accent);text-align:center;margin:0 0 14px}.eyebrow{display:block;text-align:center;text-transform:uppercase;font-size:10px;letter-spacing:2.4px;color:var(--muted)}h1{font:400 37px/1.15 Georgia,'Times New Roman',serif;letter-spacing:-1.4px;margin:14px 0;text-align:center}p{color:var(--muted);margin:0 0 26px;text-align:center}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input,button{font:inherit;width:100%;border-radius:7px 13px;padding:13px 16px}input{border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:52px}button{border:3px double var(--btn);background:var(--accent);color:var(--btn);font-weight:750;cursor:pointer;margin-top:16px;min-height:52px}input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.error{font-size:14px;color:var(--accent);margin:10px 0 0;text-align:left}.error:empty{display:none}.foot{font-size:12px;text-align:center;margin:25px 0 0;padding-top:14px;border-top:3px double var(--gold)}@media(max-width:400px){.card{padding:32px 22px}h1{font-size:31px}}
</style></head><body><main class="card"><div class="heart" aria-hidden="true">♥</div><span class="eyebrow">private club · rose & midnight</span><h1>Только для своих.</h1><p>Введи наш пароль — и заходи на Girl’s Night.</p><form action="/login" method="post"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus aria-describedby="error"><p class="error" id="error" role="alert">__ERROR__</p><button type="submit">Войти</button></form><p class="foot">♢ &nbsp; Только для своих &nbsp; ♢</p></main></body></html>
